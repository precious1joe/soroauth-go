# The two checks the branch ruleset requires.
#
# Never filtered by path. A required check that is skipped reports no
# conclusion, and the pull request can then never be merged.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      # -race because internal/xdrcopy shares encoder/decoder buffers across
      # calls through sync.Pool: TestCopyConcurrentReuse only proves the
      # no-aliasing guarantee holds under concurrency if something is actually
      # watching for concurrent misuse.
      - name: test
        run: go test -race ./...

  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # @stellar/stellar-sdk@17.1.0 declares engines node >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      # npm ci installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, so the reference build cannot
      # drift without this step noticing.
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs

      # The vectors are generated, committed artefacts. If regenerating them
      # changes anything, then either someone edited a vector by hand or the
      # reference implementation moved, and in both cases the committed
      # evidence no longer says what it claims to.
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  # Third and final pull-request check. The fixture contracts are Rust and the
  # Go jobs do not compile them, which is how a contract that had never built
  # reached main and broke the scheduled e2e run for five runs in a row.
  #
  # Build and unit-test in one job on purpose: pull requests are capped at three
  # checks, so this covers both rather than becoming two.
  contracts:
    name: contracts build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-toolchain.toml pins the channel and the wasm32v1-none target, so
      # rustup installs exactly what the contracts are built with.
      - name: show the pinned toolchain
        run: |
          rustc --version
          cargo --version
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e/contracts/target
          key: contracts-${{ runner.os }}-${{ hashFiles('e2e/contracts/Cargo.lock') }}
          restore-keys: contracts-${{ runner.os }}-
      - name: cargo test
        run: cargo test --workspace --locked
      - name: build every contract to wasm
        run: cargo build --release --target wasm32v1-none --workspace --locked
